name: ONNX numerical correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onnx-numerical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    name: Before/after ONNX equivalence (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install build tools and numerical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          python -m pip install -r tests/requirements.txt
      - name: Cache pinned LLVM/MLIR build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/downloads
            .deps/src
            build
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-mlir-v1-${{ hashFiles('third_party/dependencies.lock.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt', 'tools/bootstrap.py', 'tools/dependency_patches.py', 'third_party/patches/**') }}
      - name: Build legalization engine and run native checks
        run: python tools/bootstrap.py --test --jobs 2
      - name: Check numerical comparator rejects incorrect outputs
        run: python tests/validate_numerical_comparator.py
      - name: Compare channel-mean ONNX before and after legalization
        run: python tests/validate_onnx.py
      - name: Compare unfold ONNX before and after legalization
        run: python tests/validate_unfold.py
      - name: Compare remaining ONNX legalization patterns
        run: python tests/validate_legalizations.py
      - name: Check dependency patches
        run: python tests/validate_dependency_patches.py
      - name: Upload numerical reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onnx-numerical-reports
          path: |
            artifacts/**/*.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
